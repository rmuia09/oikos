# nginx server block — serving the static build on a subdomain.
#
# Build first (assets resolve from the site root, no path prefix):
#   cd gatsby
#   GATSBY_WP_URL=https://example.com GATSBY_SITE_URL=https://app.example.com npm run build
#
# Then point `root` at gatsby/public and reload nginx.

server {
    listen 443 ssl http2;
    server_name app.example.com;

    root /var/www/oikos/public;
    index index.html;

    # Static single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gatsby hashes asset filenames, so they can be cached forever.
    location ~* \.[0-9a-f]{16,}\.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML must always be revalidated.
    location ~* \.html?$ {
        add_header Cache-Control "no-cache";
    }

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
}

server {
    listen 80;
    server_name app.example.com;
    return 301 https://$host$request_uri;
}
